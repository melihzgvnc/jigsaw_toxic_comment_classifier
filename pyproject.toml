[project]
name = "jigsaw-classifier"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mlflow>=3.16.0",
    "pandas>=3.0.5",
    "scikit-learn>=1.9.0",
    "torch>=2.14.0",
    "torchmetrics>=1.9.0",
]

[project.scripts]
jigsaw-classifier = "jigsaw_classifier:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"
